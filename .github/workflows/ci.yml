name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build EsoData.sln -c Release
      - run: dotnet test EsoData.sln -c Release --no-build
      - run: dotnet pack src/EsoData/EsoData.csproj -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nuget-packages
          path: artifacts/packages/*
